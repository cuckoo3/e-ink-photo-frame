<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dithering Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            margin-bottom: 20px;
        }
        canvas {
            margin-top: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background-color: white;
        }
        select {
            margin-bottom: 10px;
            font-size: 16px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* Standardized Button & File Upload Style */
        button, .file-upload-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: normal;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
            text-align: center;
            box-sizing: border-box;
        }

        button:hover, .file-upload-btn:hover {
            background-color: #0056b3;
        }

        /* Hide the native file input */
        #upload {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Dithering Tool</h1>

    <!-- Custom styled file picker button -->
    <label for="upload" class="file-upload-btn">
        Browse Image
    </label>
    <input type="file" id="upload" accept="image/*">

    <br><br>

    <!-- Target Device Selector -->
    <label for="device-options"><strong>Target Device:</strong></label>
    <select id="device-options">
        <option value="">Loading devices...</option>
    </select>
	&nbsp;&nbsp;&nbsp;&nbsp;
    <!-- Dithering Algorithm Selector -->
    <label for="dither-options"><strong>Algorithm:</strong></label>
    <select id="dither-options" name="D1">
        <option value="floyd-steinberg">Floyd-Steinberg</option>
        <option value="jjn" selected="selected">Jarvis-Judice-Ninke (JJN)</option>
        <option value="stucki">Stucki</option>
    </select>

    <!-- Status Indicator -->
    <span id="render-status" style="margin-left: 10px; font-weight: bold; color: #2e7d32; display: none;">Done</span>
    <br>

    <button id="download">Download Dithered Image</button>
    <button id="upload-server">Upload to Server</button>
    <br>
    <canvas id="canvas" width="1600" height="1200"></canvas>

    <!-- External Dithering Engine -->
    <script src="dither.js"></script>

    <!-- Main UI Event Controller -->
    <script>
        const uploadInput = document.getElementById('upload');
        const deviceOptions = document.getElementById('device-options');
        const ditherOptions = document.getElementById('dither-options');
        const downloadButton = document.getElementById('download');
        const uploadServerButton = document.getElementById('upload-server');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const renderStatus = document.getElementById('render-status');

        let currentLoadedImage = null;
        let currentOffscreenCanvas = null;
        let originalFileName = 'image.png';

        // Fetch devices list from server on page load
        async function fetchDevices() {
            try {
                const response = await fetch('/admin/devices');
                if (!response.ok) throw new Error('Failed to fetch devices');

                const data = await response.json();
                deviceOptions.innerHTML = '';

                if (data.macs && data.macs.length > 0) {
                    data.macs.forEach(mac => {
                        const option = document.createElement('option');
                        option.value = mac;
                        option.textContent = mac;
                        deviceOptions.appendChild(option);
                    });
                } else {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'No devices found';
                    deviceOptions.appendChild(option);
                }
            } catch (error) {
                console.error('Error fetching device list:', error);
                deviceOptions.innerHTML = '<option value="">Error loading devices</option>';
            }
        }

        uploadInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                originalFileName = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        currentLoadedImage = img;
                        startProcessing();
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        ditherOptions.addEventListener('change', () => {
            if (currentLoadedImage) {
                startProcessing();
            }
        });

        downloadButton.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'dithered_image.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        if (uploadServerButton) {
            uploadServerButton.addEventListener('click', async () => {
                if (!currentLoadedImage || !currentOffscreenCanvas) {
                    alert('Please load an image first.');
                    return;
                }

                const selectedMac = deviceOptions.value;
                if (!selectedMac) {
                    alert('Please select a valid device MAC address.');
                    return;
                }

                renderStatus.textContent = 'Uploading...';
                renderStatus.style.display = 'inline';

                try {
                    const originalBlob = await new Promise(resolve => currentOffscreenCanvas.toBlob(resolve, 'image/jpeg', 0.8));
                    const ditheredBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

                    const baseName = originalFileName.substring(0, originalFileName.lastIndexOf('.')) || originalFileName;

                    const formData = new FormData();
                    formData.append('mac', selectedMac);
                    formData.append('original', originalBlob, `${baseName}.jpg`);
                    formData.append('dithered', ditheredBlob, `${baseName}.png`);

                    const response = await fetch('/admin/upload', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        renderStatus.textContent = 'Uploaded successfully!';
                    } else {
                        renderStatus.textContent = 'Upload failed.';
                    }
                } catch (error) {
                    console.error('Upload Error:', error);
                    renderStatus.textContent = 'Error uploading.';
                }
            });
        }

        function startProcessing() {
            renderStatus.textContent = 'Processing...';
            renderStatus.style.display = 'inline';

            setTimeout(() => {
                renderAndDither();
            }, 20);
        }

        function renderAndDither() {
            if (!currentLoadedImage) return;

            currentOffscreenCanvas = getScaledAndCroppedCanvas(currentLoadedImage);

            canvas.width = currentOffscreenCanvas.width;
            canvas.height = currentOffscreenCanvas.height;

            const offCtx = currentOffscreenCanvas.getContext('2d');
            const originalImageData = offCtx.getImageData(0, 0, canvas.width, canvas.height);

            applyDitheringToBuffer(originalImageData, ditherOptions.value);

            ctx.putImageData(originalImageData, 0, 0);

//            addWhiteBorder(ctx, canvas.width, canvas.height, 10);

            renderStatus.textContent = 'Done';
            renderStatus.style.display = 'inline';
        }

        // Initialize device dropdown on page load
        fetchDevices();
    </script>
</body>
</html>
