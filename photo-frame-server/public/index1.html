<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Paper Admin Panel</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; background: #f8f9fa; color: #333; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        h2 { margin-top: 0; color: #2c3e50; font-size: 1.25rem; }
        .status-item { margin: 8px 0; font-size: 0.95rem; }
        .status-value { font-weight: bold; color: #007bff; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>E-Paper Server Admin Panel</h1>

    <div class="card">
        <h2>ESP32 Connection Status</h2>
        <div class="status-item">ESP32 IP: <span id="esp-ip" class="status-value">Loading...</span></div>
        <div class="status-item">Last Discovery: <span id="last-seen" class="status-value">Loading...</span></div>
        <div class="status-item">Current Text: <span id="current-msg" class="status-value">Loading...</span></div>
    </div>

    <div class="card">
        <h2>Update Display Content</h2>
        <input type="text" id="msg-input" placeholder="Enter text to display..." />
        <button onclick="updateText()">Send to E-Paper</button>
    </div>

    <script>
        // Fetch status from server REST API
        async function loadStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('esp-ip').innerText = data.lastEspIp;
                document.getElementById('last-seen').innerText = data.lastSeen;
                document.getElementById('current-msg').innerText = data.currentMessage;
            } catch (e) {
                console.error('Failed to load status', e);
            }
        }

        // Post updated text to server REST API
        async function updateText() {
            const input = document.getElementById('msg-input');
            if (!input.value) return;

            await fetch('/api/update-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: input.value })
            });

            input.value = '';
            loadStatus();
        }

        // Auto-refresh panel status every 3 seconds
        loadStatus();
        setInterval(loadStatus, 3000);
    </script>
</body>
</html>
